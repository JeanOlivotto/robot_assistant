# nginx do HOST -> robo-gateway em 127.0.0.1:8080
#
# Instalar em /etc/nginx/conf.d/robo.conf. Versão só HTTP: o `certbot --nginx`
# acrescenta o bloco 443 e o redirect. O $connection_upgrade vem do
# 00-upgrade-map.conf que o 2fitspace já instalou.

server {
    listen 80;
    listen [::]:80;
    server_name srv1966497.hstgr.cloud;

    server_tokens off;

    access_log /var/log/nginx/robo.access.log;
    error_log  /var/log/nginx/robo.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets do robô (/device) e do webapp (/app).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Os dois lados mandam ping a cada 15–30 s; 120 s em silêncio = conexão morta.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
